version: '3.8'

networks:
    backend-network:
        driver: bridge

services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: "CRUDIFY"

        ports:
            - "8000:8000"

        volumes:
            - .:/data

        networks:
            - backend-network
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload