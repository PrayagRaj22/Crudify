version: "3.8"

services:
    # BACKEND - FASTAPI
    backend:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        networks:
            - backend-network
        depends_on:
            - database
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
            interval: 30s
            timeout: 10s
            retries: 3

    # DATABASE - MONGODB
    database:
        image: mongo:7.0
        restart: unless-stopped
        ports:
            - "27017:27017"
        #        environment:
        #            - MONGO_INITDB_ROOT_USERNAME=MONGO_USER
        #            - MONGO_INITDB_ROOT_PASSWORD=MONGO_PWD
        volumes:
            - mongo_db:/data/db
        networks:
            - backend-network
        env_file:
            - .env

    # WEB SERVER - NGINX
    nginx:
        image: nginx:1.25-alpine-slim
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - backend
        networks:
            - backend-network

volumes:
    mongo_db:
        name: DB

networks:
    backend-network:
        driver: bridge
