name: CD Pipeline

on:
    push:
        branches: [dev]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Docker login
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PWD }}

            - name: Build Image
              run: |
                docker build \
                -t ${{ secrets.DOCKERHUB_USERNAME}}/backend_apis:${{ github.sha }}\
                -f docker/Dockerfile .

            - name: Tag latest version
              run: |
                docker tag \
                ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:${{ github.sha }} \
                ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:latest


            - name: Push Docker Images
              run: |
               docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:${{ github.sha }}
               docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:latest