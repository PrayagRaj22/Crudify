name: CD Pipeline

on:
    push:
        branches: [dev]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Login into Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PWD }}

            - name: Build Image & Push the Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:${{ github.sha }}
                    ${{ secrets.DOCKERHUB_USERNAME }}/backend_apis:latest
